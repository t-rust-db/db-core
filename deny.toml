# cargo-deny policy for db-core. See `make check-deny` / .github/workflows/ci.yml.
# db-core has zero dependencies today (Cargo.toml `[dependencies]` is empty);
# this file exists to gate whatever gets added later, not because there's
# anything to check yet.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# db-core itself is Apache-2.0. No dependency today pulls in anything else;
# add a license here only once a real dependency actually needs it.
allow = ["Apache-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
