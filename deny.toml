# cargo-deny policy for db-core. See `make check-deny` / .github/workflows/ci.yml.
# db-core's only dependencies are the two optional `storage-column` crates
# (`memmap2`, `ruzstd`, ADR 0016/#288) and their closure; everything else in
# the crate is std-only.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# db-core itself is Apache-2.0. `MIT` is for the `storage-column` closure
# (#288): ruzstd 0.7.3, twox-hash 1.6.3 are MIT-only; the rest are Apache-2.0 OR MIT dual-licensed.
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
