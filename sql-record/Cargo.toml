[package]
name = "sql-record"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite record format decoding/encoding, extracted from sqlite-rs's src/record"

[dependencies]

[lints.clippy]
# Matches sqlite-rs's own [lints.clippy] baseline (see its Cargo.toml) --
# this module's existing #[allow(...)] annotations assume this strict
# baseline is in force; without it here too, those allows are dead code
# and clippy won't flag what they were guarding against.
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
mod_module_files = "deny"
