[package]
name = "db-core"
version = "0.83.1"
# The three [[bench]] targets are declared explicitly; `benches/common.rs`
# is their shared harness module, not a bench of its own.
autobenches = false
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/t-rust-db/db-core"
description = "Shared SQL language/execution layer for t-rust-db: types, expr, parser, join, vm, codegen, emit"

[lib]
name = "db_core"
path = "src/lib.rs"

[[test]]
name = "unit_mcdc_discharge"
path = "tests/unit/mcdc_discharge_test.rs"

[[test]]
name = "unit_vm_row_hooks"
path = "tests/unit/vm_row_hooks_test.rs"

[[test]]
name = "unit_parser_public_api"
path = "tests/unit/parser_public_api_test.rs"

[[test]]
name = "unit_index_seek"
path = "tests/unit/index_seek_test.rs"
required-features = ["engine-row"]

[[test]]
name = "unit_engine_column_public_api"
path = "tests/unit/engine_column_public_api_test.rs"
required-features = ["engine-column"]

[[test]]
name = "unit_engine_public_api"
path = "tests/unit/engine_public_api_test.rs"
required-features = ["engine-row"]

[[test]]
name = "unit_vm_row_public_api"
path = "tests/unit/vm_row_public_api_test.rs"

[[test]]
name = "unit_vm_batch_public_api"
path = "tests/unit/vm_batch_public_api_test.rs"

[[test]]
name = "unit_codegen_roundtrip"
path = "tests/unit/codegen_roundtrip_test.rs"

[[test]]
name = "unit_codegen_cursor_factory"
path = "tests/unit/codegen_cursor_factory_test.rs"

[[test]]
name = "unit_nesting_depth"
path = "tests/unit/nesting_depth_test.rs"

[[test]]
name = "unit_root_public_api"
path = "tests/unit/root_public_api_test.rs"

[[test]]
name = "unit_codegen_batch_public_api"
path = "tests/unit/codegen_batch_public_api_test.rs"

[[test]]
name = "unit_codegen_batch_emit"
path = "tests/unit/codegen_batch_emit_test.rs"

[[test]]
name = "unit_vm_engine_join_public_api"
path = "tests/unit/vm_engine_join_public_api_test.rs"

[[test]]
name = "01_neon_batch_kernels"
path = "tests/spike/001_neon_batch_kernels/01_neon_batch_kernels.rs"

[[test]]
name = "02_neon_adjusted"
path = "tests/spike/001_neon_batch_kernels/02_neon_adjusted.rs"

[[test]]
name = "03_batch_specific"
path = "tests/spike/001_neon_batch_kernels/03_batch_specific.rs"

[[test]]
name = "04_adjusted"
path = "tests/spike/001_neon_batch_kernels/04_adjusted.rs"

[[test]]
name = "01_groupreduce_key_hashing"
path = "tests/spike/002_arrow_optimization/01_groupreduce_key_hashing.rs"

[[test]]
name = "02_groupreduce_key_hashing_adjusted"
path = "tests/spike/002_arrow_optimization/02_groupreduce_key_hashing_adjusted.rs"

[dependencies]
# Storage backends (ADR 0016: db-storage absorbed as the `storage` module).
# Both optional, pulled in only by storage-column (the only consumer of
# either today).
memmap2 = { version = "0.9.11", optional = true }
ruzstd = { version = "0.7", optional = true }

[dev-dependencies]

[[bin]]
name = "lock_probe"
path = "tests/helpers/lock_probe.rs"
required-features = ["storage-row"]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "codegen"
harness = false

[[bench]]
name = "vm_opcodes"
harness = false

[features]
# Every feature on by default (db-core#111): `cargo-mvl-mcdc harvest`
# (the MC/DC discharge tool -- see `make test-mcdc`) hardcodes a
# feature-less `cargo test`, so any module gated out of `default` would
# never compile under it and its obligations could never be discharged.
# Consumers that want to be explicit about depending on exactly what
# they use (column-rs does) set `default-features = false, features =
# [...]` regardless of this default -- narrowing it here would only
# affect a fresh `cargo add db-core`/bare `cargo build` in this repo.
default = [
    "parser-column",
    "vm-batch",
    "vm-row",
    "vm-stream",
    "codegen-batch",
    "codegen-row",
    "codegen-stream",
    "emit-batch",
    "storage-row",
    "storage-column",
    "storage-stream",
    "engine-row",
    "engine-column",
]

# `parser`: one grammar section per Cargo feature, mirroring `vm`'s own
# `batch`/`row`/`stream` split (ADR 0001/0002).
# `parser-column` no longer has its own tokenizer/grammar (#57): it's a
# thin adapter over `parser-row`'s, so it implies `parser-row`.
parser-column = ["parser-row"]
parser-row = []

# `vm`: one executor per Cargo feature -- a consumer enables only the
# one(s) it uses, so e.g. column-rs (`vm-batch` only) never compiles
# `vm-row`/`vm-stream` or pulls in a dependency only one of them needs.
vm-batch = []
vm-row = []
vm-stream = []

# `codegen`: the planner (AST -> executable `Program`), sqlite-rs's
# meaning of the word (ADR 0007). One per `vm` executor; `codegen-batch`
# needs `vm-batch`'s `Program`/`Opcode` types to build, and (#153)
# `parser-column`'s validator to enforce the batch-planner's analytics
# subset over `parser::ast::Select`.
codegen-batch = ["vm-batch", "parser-column"]
# `vm-batch` here: `codegen::row`'s aggregate codegen shares `vm::batch`'s
# `AggFunc` enum (#153 -- one execution-operand enum for both engines).
codegen-row = ["vm-row", "parser-row", "vm-batch"]
codegen-stream = []

# `emit-batch`: the ahead-of-time Rust-source emitter over the batch
# planner's output, `codegen::batch::emit` (ADR 0007; db-core#192 folded
# it into `codegen::batch` from a former crate-level `emit` module that
# mirrored `vm`'s `batch`/`row`/`stream` split -- `emit-row`/`emit-stream`
# never had code behind them and are retired along with that mirror).
# `emit-batch` renders a planned `codegen::batch` program to `const
# PROGRAM` source text, so it needs the planner (and, through it,
# `vm-batch`'s `Opcode`/`Value` types).
emit-batch = ["codegen-batch"]

# `storage` (ADR 0016: absorbed from the standalone db-storage repo):
# physical storage, one feature-gated module per execution mode
# (`row`/`column`/`stream` -- ADR 0006), independent of the parser/vm/
# codegen split above.
# `storage::row::schema::ddl_reader` parses `sqlite_master` DDL through
# `TableSchema::with_computed_rowid_alias` (`parser-row`); db-storage carried
# this as `db-core = { features = ["parser-row"] }` and the merge dropped it
# (0.78.0 did not compile with `storage-row` alone).
storage-row = ["parser-row"]
storage-column = ["dep:memmap2", "dep:ruzstd"]
storage-stream = ["vm-stream"]
# Test-support helpers (e.g. `storage::row::btree::test_minimal_db`)
# for consumers' own test suites -- enable from `[dev-dependencies]`
# only (db-storage#13).
storage-test-support = []

# `engine` (#295, ADR 0017): the client-facing seam over the execution
# modes. `engine-row` is the row implementation -- storage::row wired to
# vm::row through the ADR 0008 boundary traits (the glue that lived in
# sqlite-rs's vdbe/adapter.rs), plus parse -> compile -> execute.
engine-row = ["storage-row", "parser-row", "vm-row", "codegen-row"]
# `engine-column` (#325): the batch implementation -- one Parquet file as one
# table, through storage::column and vm::batch (column-rs's QueryEngine
# single-file case, ported).
engine-column = ["storage-column", "parser-column", "vm-batch", "codegen-batch"]

# sqlite-rs's lint bar (#82).
[lints.rust]
# `deny` rather than `forbid`: storage::column::mmap and
# storage::row::vfs::fcntl each carry one documented, audited
# `#[allow(unsafe_code)]` carve-out (ADR 0016).
unsafe_code = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
# db-core#225: the tier below the sqlite-rs bar. `indexing_slicing` does
# not cover `&str[a..b]` (panics on a non-char boundary); the three
# `cast_*` lints catch the silent-wrong-value family `as` hides
# (`usize -> i64` wrap, `i64 -> usize` sign loss); `unreachable`/`todo`/
# `unimplemented` lock in the existing zero-count. (`missing_panics_doc`
# was evaluated and rejected: it cannot tell a guarded `expect` with a
# `reason` from a real panic, so every hit was a false positive.)
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Rust 2018 module style (db-core#192): a self-named `mod.rs` file is a
# clippy error, not just discouraged. The opposite lint,
# `self_named_module_files`, is its mirror image -- never enable both.
mod_module_files = "deny"

# `make perf` builds with this profile. Line tables make a sampling
# profiler (`make perf-profile`, Instruments/samply) show function names
# without changing codegen, so timings stay comparable (ADR 0015, tier 6).
[profile.bench]
debug = "line-tables-only"
