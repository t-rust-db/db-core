[workspace]
members = [".", "db-storage"]

[package]
name = "db-core"
version = "0.77.0"
# The three [[bench]] targets are declared explicitly; `benches/common.rs`
# is their shared harness module, not a bench of its own.
autobenches = false
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/t-rust-db/db-core"
description = "Shared SQL language/execution layer for t-rust-db: types, expr, parser, join, vm, codegen, emit"

[lib]
name = "db_core"
path = "src/lib.rs"

