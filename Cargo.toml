[package]
name = "db-core"
version = "0.40.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/t-rust-db/db-core"
description = "Shared SQL language/execution layer for t-rust-db: types, expr, parser, join, vm, codegen, emit"

[lib]
name = "db_core"
path = "src/lib.rs"

[dependencies]

[features]
# `parser-column` + `vm-batch` + `codegen-batch` + `emit-batch` on by default -- these
# are the only real, tested content today, and plain `cargo test` (no
# feature flags) needs something to exercise. Consumers that want to be
# explicit about depending on exactly what they use (column-rs does) set
# `default-features = false, features = [...]` regardless of this default.
default = ["parser-column", "vm-batch", "codegen-batch", "emit-batch"]

# `parser`: one grammar section per Cargo feature, mirroring `vm`'s own
# `batch`/`row`/`stream` split (ADR 0001/0002).
# `parser-column` no longer has its own tokenizer/grammar (#57): it's a
# thin adapter over `parser-row`'s, so it implies `parser-row`.
parser-column = ["parser-row"]
parser-row = []

# `vm`: one executor per Cargo feature -- a consumer enables only the
# one(s) it uses, so e.g. column-rs (`vm-batch` only) never compiles
# `vm-row`/`vm-stream` or pulls in a dependency only one of them needs.
vm-batch = []
vm-row = []
vm-stream = []

# `codegen`: the planner (AST -> executable `Program`), sqlite-rs's
# meaning of the word (ADR 0007). One per `vm` executor; `codegen-batch`
# needs `vm-batch`'s `Program`/`Opcode` types to build.
codegen-batch = ["vm-batch"]
codegen-row = ["vm-row"]
codegen-stream = []

# `emit`: one ahead-of-time Rust-source emitter per Cargo feature, one
# per `vm` executor (ADR 0007). `emit-batch` renders a planned
# `codegen::batch` program to `const PROGRAM` source text, so it needs the
# planner (and, through it, `vm-batch`'s `Opcode`/`Value` types).
emit-batch = ["codegen-batch"]
emit-row = []
emit-stream = []

# sqlite-rs's lint bar (#82). mod_module_files deliberately absent: the tree
# still has mod.rs module roots (src/codegen/row/mod.rs, ...).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
