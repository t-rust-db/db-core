name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".openspec/**"
  # No `paths-ignore` here: main's merge queue (#764) waits on these checks,
  # and a check that never runs never reports, which would hold a docs-only
  # PR in the queue forever.
  pull_request:
    branches: [main]
  # The merge queue builds each entry on top of the ones ahead of it and
  # waits for these same checks to pass on that merge commit.
  merge_group:
    types: [checks_requested]

# A push to a PR branch supersedes the run still going for its previous
# commit; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # cargo-mvl-limit is not published to crates.io, so the qualified-subset
  # gate builds it from source at this pinned rev. Bumping it is a reviewed
  # change, like any other pinned tool version.
  MVL_RUST_REV: "5a5ffd5a8e79298271a65649b3f586ebce2ffb31"
  # cargo-public-api is not in install-action's prebuilt list, so it was
  # compiled from source on every run (72 s). Pinned and cached instead;
  # bumping it is a reviewed change, and a new version can change the
  # snapshot's rendering.
  PUBLIC_API_VERSION: "0.52.0"

jobs:
  # Formatting and lint. Fails fast, cheap, no dependency-graph work needed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: make lint

  # Supply-chain policy: licenses, banned/duplicate crates, allowed sources.
  # See deny.toml.
  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deny
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make check-deny

  # Qualified-subset gate (cargo-mvl-limit): flags language features
  # (explicit lifetimes beyond function-scoped elision, dyn dispatch,
  # non-allowlisted macros, ...) outside the subset this codebase holds
  # itself to. Blocking since #156 cleared the backlog. The documented
  # `dyn` boundary (vm/row's storage traits, ADR 0008) is exempt via the
  # Makefile's MVL_LIMIT_EXCLUDE -- see that comment for why.
  mvl-limit:
    name: Qualified subset (cargo-mvl-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mvl-limit
      - name: Cache cargo-mvl-limit
        id: cache-mvl
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mvl-limit
          key: cargo-mvl-limit-${{ runner.os }}-${{ env.MVL_RUST_REV }}
      - name: Build cargo-mvl-limit
        if: steps.cache-mvl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --git https://github.com/mvl-lang/mvl-rust \
            --rev "$MVL_RUST_REV" rust-limit --bin cargo-mvl-limit --locked --force
      - run: make check-mvl-limit

  # MC/DC snapshot freshness (db-core#335, db-core#413, ADR 0000
  # §Invariants (e)): `tests/mcdc/obligations.json` must match a fresh
  # scan of src/, or a discharge tag (`mcdc__<id>__vN`) can silently
  # point at a stale line/obligation. `make ci` already runs this
  # locally; this job is what makes that true on every PR instead of
  # only for whoever runs `make ci` by hand. This is a scan + byte
  # comparison against the committed snapshot -- cheap, unlike
  # `make test-mcdc` (assurance.yml's weekly `mcdc-dashboard` job), which
  # regenerates the snapshot and re-runs the whole test suite through
  # `cargo-mvl-mcdc harvest`.
  mcdc-fresh:
    name: MC/DC snapshot freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcdc-fresh
      - name: Cache cargo-mvl-mcdc
        id: cache-mcdc
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mvl-mcdc
          key: cargo-mvl-mcdc-${{ runner.os }}-${{ env.MVL_RUST_REV }}
      - name: Build cargo-mvl-mcdc
        if: steps.cache-mcdc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --git https://github.com/mvl-lang/mvl-rust \
            --rev "$MVL_RUST_REV" rust-mcdc --bin cargo-mvl-mcdc --locked --force
      - run: make check-mcdc-fresh

  # Standalone feature builds (db-core#413, ADR 0000 §Invariants (d)):
  # each of the Makefile's curated `FEATURES` must `cargo check` cleanly
  # on its own -- catches a feature that silently depends on another
  # being enabled alongside it.
  features:
    name: Standalone feature builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
      - run: make check-features

  # Charter gate (ADR 0000, #324): the SQLite profile -- the exact feature
  # set sqlite-rs builds -- resolves to first-party crates only, carries
  # exactly the named `unsafe` carve-outs, and compiles no batch/column/
  # stream file. Measured from rustc's dep-info, so it costs one `cargo
  # check`-sized build.
  sqlite-profile:
    name: SQLite profile (charter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sqlite-profile
      - run: make check-sqlite-profile

  # Charter gate (ADR 0000, db-core#403): the stream profile -- the log
  # engine's execution mode -- resolves to first-party crates only and
  # carries exactly the named `unsafe` carve-outs (empty, currently).
  stream-profile:
    name: Stream profile (charter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stream-profile
      - run: make check-stream-profile

  # Charter gate (ADR 0000, db-core#405): the column profile -- the
  # Parquet analytics mode. Not first-party-only by design (memmap2
  # is an accepted dependency), so only invariant (b) -- exactly
  # the named `unsafe` carve-out -- is checked here.
  column-profile:
    name: Column profile (charter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: column-profile
      - run: make check-column-profile

  # Public API surface (db-core#360): `tests/public_api.md` must match a
  # fresh `cargo-public-api` scan, or a widened/narrowed `pub` surface can
  # ship without a reviewed diff. Needs nightly for rustdoc JSON output,
  # unlike every other gate here -- `cargo public-api` shells out to
  # `cargo +nightly rustdoc` itself, so nightly is installed alongside
  # stable rather than as the job's only toolchain.
  # Parquet writer interoperability (#566): files the writer produces must
  # read back identically -- types, values, per-row-group statistics -- in
  # DuckDB and pyarrow, not just in our own reader. Both run here only,
  # through uv at the exact versions the Makefile pins; neither is a
  # dependency of the crate (see the Makefile note on ADR 0000 §(f)).
  parquet-write-oracle:
    name: Parquet writer interop (DuckDB, pyarrow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parquet-write-oracle
      - uses: astral-sh/setup-uv@v6
      - run: make check-parquet-write-oracle

  public-api:
    name: Public API surface (cargo-public-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
      - name: Cache cargo-public-api
        id: cache-public-api
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-${{ env.PUBLIC_API_VERSION }}
      - name: Build cargo-public-api
        if: steps.cache-public-api.outputs.cache-hit != 'true'
        run: cargo install cargo-public-api --version "$PUBLIC_API_VERSION" --locked
      - run: make check-public-api-fresh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: make test

  # Compile-level guard for the AOT emitter (db-core#447). The source
  # `codegen::batch::emit` generates calls the *consumer's*
  # `query::run_program`/`execute_*` and iterates the result, so db-core
  # cannot compile it in-repo without depending on its own downstream --
  # and its emit tests therefore compare generated *text* only. That is how
  # #436 changed the query-output type, left three `for row in rows {`
  # template sites behind, broke every emitted program, and stayed green
  # across 1888 db-core tests. column-rs's `tests/codegen_e2e.rs` is the one
  # guard that emits, compiles the result with rustc against the built
  # `column_rs` rlib, runs it, and diffs against `QueryEngine::execute`.
  # This job runs it against *this* db-core, through column-rs in the
  # t-rust-db/tools workspace with a `[patch]` to this checkout added for
  # the run (tools itself pins a db-core release tag and never patches),
  # whenever a PR touches the emitter or the query-output surface -- and
  # always on a push to main.
  emit-compile-guard:
    name: Emit compile guard (column-rs codegen_e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: db-core
          fetch-depth: 0
      - name: Decide whether the emitter or query-output surface changed
        id: relevant
        working-directory: db-core
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # A breaking change to the query-output surface needs a companion
          # tools branch to compile against; the PR body names it with a
          # line `tools-ref: <branch-or-sha>`. Default: tools main.
          ref="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^[[:space:]]*tools-ref:[[:space:]]*([^[:space:]]+).*/\1/p' | head -1)"
          echo "tools_ref=${ref:-main}" >> "$GITHUB_OUTPUT"
          echo "tools ref: ${ref:-main}"
          if [ "$EVENT" = "push" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Also on changes to this workflow itself, so an edit to the
          # guard is exercised by the PR that makes it.
          if git diff --name-only "$BASE" "$HEAD" | grep -qE \
               '^src/codegen/batch/emit\.rs$|^src/codegen/batch\.rs$|^src/vm/batch\.rs$|^src/vm/engine\.rs$|^\.github/workflows/ci\.yml$'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "no emitter/query-output change; skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.relevant.outputs.hit == 'true'
        with:
          repository: t-rust-db/tools
          ref: ${{ steps.relevant.outputs.tools_ref }}
          path: tools
      - uses: dtolnay/rust-toolchain@stable
        if: steps.relevant.outputs.hit == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.relevant.outputs.hit == 'true'
        with:
          shared-key: emit-compile-guard
          workspaces: tools
      # Two things stop a patch from applying, and either one makes cargo
      # silently fall back to the pinned git tag -- so this guard would
      # test the *old* db-core (db-core#481: every run from v0.107.0 to
      # v0.110.0 tested v0.106.1 and nobody could tell):
      #   1. the workspace's `version = "0.114.7"` requirement is
      #      `^0.114.7`, which pre-1.0 excludes every later minor; and
      #   2. the committed Cargo.lock locks db-core to the tag's git rev,
      #      which cargo keeps until that package is re-resolved.
      # This guard's question is "does column-rs compile and run against
      # *this* db-core", so neither belongs in its inputs: in the
      # ephemeral checkout, widen the requirement, add the patch and
      # re-resolve db-core, then still assert the result is this checkout.
      - name: Point the tools workspace's db-core at this checkout
        if: steps.relevant.outputs.hit == 'true'
        working-directory: tools
        run: |
          set -euo pipefail
          before="$(grep -oE '^db-core *= *\{[^}]*\}' Cargo.toml | grep -oE 'version *= *"[^"]+"' || true)"
          sed -i -E 's/^(db-core *= *\{[^}]*version *= *")[^"]+"/\1>=0.0.0"/' Cargo.toml
          printf '\n[patch."https://github.com/t-rust-db/db-core"]\ndb-core = { path = "../db-core" }\n' >> Cargo.toml
          echo "tools pins db-core ${before:-<no version>} -> widened to >=0.0.0 and patched to ../db-core for this run"
          cargo update -p db-core
      - name: Assert column-rs resolved db-core to this checkout
        if: steps.relevant.outputs.hit == 'true'
        working-directory: tools
        run: |
          set -euo pipefail
          cargo tree -p column-rs -i db-core --edges normal --prefix none > /tmp/db-core-resolution.txt
          resolved="$(head -1 /tmp/db-core-resolution.txt)"
          echo "db-core resolved to: $resolved"
          case "$resolved" in
            *"$GITHUB_WORKSPACE/db-core"*) ;;
            *) echo "::error::column-rs resolved db-core to '$resolved', not this checkout even after widening its requirement, patching and re-resolving." ; exit 1 ;;
          esac
      - name: Emit, compile and run generated programs against this db-core
        if: steps.relevant.outputs.hit == 'true'
        working-directory: tools
        run: cargo test --release -p column-rs --test codegen_e2e

  # ADR 0000 §(g), db-core#407: one 85% line-coverage floor over all of
  # db-core (--all-features), crate-wide and per-file, every PR -- no
  # longer a weekly SQLite-profile-only measurement (moved from
  # assurance.yml's former `profile-coverage` job).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: make check-coverage
