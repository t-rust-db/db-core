name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".openspec/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".openspec/**"

env:
  # cargo-mvl-limit is not published to crates.io, so the qualified-subset
  # gate builds it from source at this pinned rev. Bumping it is a reviewed
  # change, like any other pinned tool version.
  MVL_RUST_REV: "a64eb33e7c9ef9ad031d22a70405e59aa1ad3cb0"

jobs:
  # Formatting and lint. Fails fast, cheap, no dependency-graph work needed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: make lint

  # Supply-chain policy: licenses, banned/duplicate crates, allowed sources.
  # See deny.toml.
  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deny
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make check-deny

  # Qualified-subset gate (cargo-mvl-limit): flags language features
  # (explicit lifetimes beyond function-scoped elision, dyn dispatch,
  # non-allowlisted macros, ...) outside the subset this codebase holds
  # itself to. Blocking since #156 cleared the backlog. The documented
  # `dyn` boundary (vm/row's storage traits, ADR 0008) is exempt via the
  # Makefile's MVL_LIMIT_EXCLUDE -- see that comment for why.
  mvl-limit:
    name: Qualified subset (cargo-mvl-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mvl-limit
      - name: Cache cargo-mvl-limit
        id: cache-mvl
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mvl-limit
          key: cargo-mvl-limit-${{ runner.os }}-${{ env.MVL_RUST_REV }}
      - name: Build cargo-mvl-limit
        if: steps.cache-mvl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --git https://github.com/mvl-lang/mvl-rust \
            --rev "$MVL_RUST_REV" rust-limit --bin cargo-mvl-limit --locked --force
      - run: make check-mvl-limit

  # MC/DC snapshot freshness (db-core#335, ADR 0000 §Invariants (e)):
  # `tests/mcdc/obligations.json` must match a fresh scan of src/, or a
  # discharge tag (`mcdc__<file>_<line>__vN`) can silently point at a
  # stale line/obligation. `make ci` already runs this locally; this job
  # is what makes that true on every PR instead of only for whoever runs
  # `make ci` by hand.
  # Unit/integration test suite, all features.
  # Charter gate (ADR 0000, #324): the SQLite profile -- the exact feature
  # set sqlite-rs builds -- resolves to first-party crates only, carries
  # exactly the named `unsafe` carve-outs, and compiles no batch/column/
  # stream file. Measured from rustc's dep-info, so it costs one `cargo
  # check`-sized build.
  sqlite-profile:
    name: SQLite profile (charter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sqlite-profile
      - run: make check-sqlite-profile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: make test
