# Weekly assurance (ADR 0000 §Invariants, db-core#324): the checks too slow
# for every pull request, run on a schedule and on demand, with a job summary
# instead of a red X -- these report drift; the PR gates block it.
#
# `ci.yml` is the PR gate set (lint, deny, mvl-limit, mcdc-fresh, features,
# sqlite-profile, stream-profile, column-profile, public-api, test,
# coverage -- db-core#407 moved the crate-wide coverage floor here from a
# weekly SQLite-profile-only job). This workflow adds what `make ci`
# deliberately leaves out: the MC/DC discharge dashboard over the whole
# crate, and Miri over the library unit tests (findings filed as `miri`
# issues).
name: Assurance

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  MVL_RUST_REV: "5a5ffd5a8e79298271a65649b3f586ebce2ffb31"

jobs:
  # The full-size test run (#726). The pull-request `Test` job samples the
  # Parquet corruption test so that it stays quick; this runs every
  # mutation. Unlike the dashboards here it is a gate, not a report: a
  # failure turns the run red.
  full-size-tests:
    name: Full-size tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: make test-full

  # MC/DC discharge dashboard over all of src/. `check-mcdc-fresh` (a PR
  # gate) proves the snapshot is current and every tagged test names a real
  # obligation; this reports how many multi-leaf obligations are actually
  # discharged, which is a number worth watching, not blocking on.
  mcdc-dashboard:
    name: MC/DC dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: assurance-mcdc
      - name: Install cargo-mvl-mcdc (pinned)
        run: |
          cargo install --git https://github.com/mvl-lang/mvl-rust \
            --rev "$MVL_RUST_REV" rust-mcdc --bin cargo-mvl-mcdc --locked --force
      - name: Harvest
        run: |
          set -o pipefail
          make test-mcdc 2>&1 | tee mcdc.log || true
          {
            echo "## MC/DC dashboard"
            echo
            echo '```'
            grep -E 'multi-leaf|overall discharged|SUMMARY' mcdc.log || tail -20 mcdc.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Miri over the library unit tests: undefined behaviour and leaks in the
  # few unsafe blocks and everything they reach. Each test runs in its own
  # Miri process (nextest), which costs ~8 s of startup per test, so the
  # run is split in four hash partitions on parallel runners. Not a gate:
  # every failure becomes a `miri` issue (miri-tickets below).
  miri:
    name: Miri (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: assurance-miri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo miri setup
      - name: Run
        run: make miri MIRI_ARGS="--partition hash:${{ matrix.partition }}/4" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miri-junit-${{ matrix.partition }}
          path: target/nextest/miri/junit.xml
          if-no-files-found: error

  miri-tickets:
    name: Miri findings -> issues
    needs: miri
    # Not on a cancelled run: partial reports would file partial findings.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: miri-junit-*
          path: miri-junit
      - name: File issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/miri_tickets.py miri-junit/*/junit.xml \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
