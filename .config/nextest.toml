# Only the `miri` profile is used today (weekly Miri job, assurance.yml):
# nextest runs every test in its own Miri process, so one test hitting
# undefined behaviour reports a failure instead of aborting the whole run.
[profile.miri]
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 4 }
# Tests Miri cannot run, or already-ticketed findings, generated from the
# first run's report (db-core run 41783798849) and kept by hand since.
# Each group says why. A new failure outside this list is a finding:
# tools/miri_tickets.py files it. When a ticket's fix lands, drop its
# lines so the run checks those tests again.
# Excluded, in the order the groups appear below (nextest filtersets
# have no comments):
#   1. ingest fsyncs directories (7 production sites); Miri only fsyncs regular files
#   2. column tables are ingest-backed, same directory fsync
#   3. POSIX byte-range locks: Miri has no fcntl(F_SETLK)
#   4. POSIX byte-range locks (fcntl F_SETLK) / the lock_probe helper process; RowEngine::create takes them too
#   5. std::fs::copy -> copy_file_range syscall, unsupported by Miri
#   6. spawns the zstd CLI as an oracle; Miri can't spawn processes
#   7. file-backed mmap, unsupported by Miri
#   8. over 20 min under Miri (proptest / fuzz / deep-nesting / large inputs)
#   9. the test Box::leak()s a fixture line on purpose
#   10. test asserts one pread fills the buffer; Miri returns short reads (fine, the parquet reader loops)
#   11. log(100) == 2.0 relies on the platform libm's log10, as sqlite3's does (#1002)
default-filter = """
not (

    test(/^storage::ingest::/)

  | test(/^engine::column::table::tests::/)

  | test(/^storage::row::vfs::fcntl::/)

  | test(/^storage::row::vfs::lock::/)

  | test(/^storage::row::vfs::shm::/)

  | test(=engine::row::mcdc_vectors::mcdc__engine_row_create_4b191083__v1_a_power_of_two_in_range_is_a_valid_page_size)
  | test(=storage::row::pager::tests::flush_fails_when_another_connection_holds_reserved)
  | test(=storage::row::pager::tests::open_acquires_shared_lock_released_on_drop)
  | test(=storage::row::pager::tests::open_claims_wal_read_lock_when_shm_present_released_on_drop)
  | test(=storage::row::vfs::unix::tests::lock_shared_guard_checks_reserved_and_escalates)
  | test(=storage::row::pager::checkpoint::tests::reader_mark_bounds_the_checkpoint)
  | test(=storage::row::pager::tests::hot_journal_open_fails_when_another_connection_holds_reserved)

  | test(=engine::cross_mode::tests::hash_join_against_a_sqlite_lookup_table)
  | test(=engine::cross_mode::tests::row_table_segment_and_source_yield_the_same_batch)
  | test(=engine::cross_mode::tests::scan_table_as_batch_materializes_whole_table_with_rowid_alias)
  | test(=engine::cross_mode::tests::scan_table_as_batch_rejects_unknown_column)
  | test(=engine::resolve::prune::tests::a_filter_on_a_chained_lookup_prunes_through_the_table_it_joins)
  | test(=engine::resolve::prune::tests::a_lookup_filter_matching_nothing_empties_the_join)
  | test(=engine::resolve::prune::tests::a_lookup_filter_prunes_the_row_groups_without_its_keys)
  | test(=engine::resolve::prune::tests::filters_that_say_nothing_about_the_probe_keys_prune_nothing)
  | test(=engine::resolve::prune::tests::using_and_either_on_operand_order_prune_the_same_row_groups)
  | test(=engine::row::adapter::tests::a_malformed_index_record_is_refused_when_positioned)
  | test(=engine::row::adapter::tests::an_index_entry_is_decoded_column_by_column)
  | test(=engine::row::adapter::tests::create_index_analyze_and_drop_index_exercise_schema_storage)
  | test(=engine::row::adapter::tests::journal_mode_in_a_transaction_only_refuses_a_change)
  | test(=engine::row::adapter::tests::pragma_and_explicit_transaction_modes_reach_the_real_pager_adapter)
  | test(=engine::row::adapter::tests::reading_more_columns_of_a_row_does_not_multiply_page_reads)
  | test(=engine::row::adapter::tests::reverse_scans_and_indexed_delete_exercise_last_and_prev)
  | test(=engine::row::adapter::tests::seeking_an_index_entry_compares_the_key_under_its_collations)

  | test(=storage::parquet::compression::decoder_fuzz::mutated_libzstd_frames_never_panic)
