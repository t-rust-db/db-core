[package]
name = "sql-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared query codegen for t-rust-db: batch (implemented), row and stream (not yet)"

[dependencies]
sql-expr = { path = "../sql-expr" }
sql-types = { path = "../sql-types" }
sql-vm = { path = "../sql-vm", optional = true, default-features = false }

[features]
# `batch` on by default -- it's the only real emitter today, and plain
# `cargo test --workspace` (what CI/the Makefile runs, with no per-crate
# feature flags) needs to exercise it. Consumers that want to be explicit
# about depending on exactly one emitter set `default-features = false,
# features = ["batch"]` regardless of this default -- mirrors `sql-vm`'s
# own `batch`/`row`/`stream` split exactly (db-core#20), one emitter per
# executor.
default = ["batch"]
# Each emitter is a separate feature so a consumer compiles only the
# one(s) it actually uses -- not the others' modules or their
# dependencies. `batch` needs `sql-vm`'s `batch` feature for the
# `Opcode`/`MapOp`/`Value` types it renders to Rust source; `row`/
# `stream` are stubs with no deps yet, gated the same way on principle.
batch = ["dep:sql-vm", "sql-vm/batch"]
row = []
stream = []
